version: 2.1

executors:
  package-builder:
    docker:
      - image: ghcr.io/termux/package-builder:latest
    resource_class: large

commands:
  build_packages:
    parameters:
      arch:
        type: string
      zip_arch:
        type: string
      asset_arch:
        type: string
    steps:
      - run:
          name: Copy git repo assets for << parameters.arch >>
          command: |
            mkdir -p /tmp/artifacts
            git clone https://github.com/CypherpunkArmory/UserLAnd-Assets-Support.git ~/assets
            cd ~/assets
            git fetch
            git checkout new-build
            cp ~/assets/assets/<< parameters.asset_arch >>/* /tmp/artifacts/
            cp ~/assets/assets/all/* /tmp/artifacts/
      - run:
          name: Clone termux-packages
          command: |
            git clone --depth 1 https://github.com/CypherpunkArmory/termux-packages.git ~/termux-packages
      - run:
          name: Build pulseaudio for << parameters.arch >>
          command: |
            cd ~/termux-packages
            ./build-package.sh -I -f -a << parameters.arch >> pulseaudio
          no_output_timeout: 30m
      - run:
          name: Save pulseaudio files for << parameters.arch >>
          command: |
            mkdir -p /tmp/artifacts
            ls /data/data/com.termux/files/usr/bin/
            ls /data/data/com.termux/files/usr/lib/
            ls /data/data/com.termux/files/usr/etc/pulse/
            ls /data/data/com.termux/files/usr/lib/pulseaudio/
            ls /data/data/com.termux/files/usr/lib/pulseaudio/modules/

            cp /data/data/com.termux/files/usr/bin/pulseaudio /tmp/artifacts/
            cp /data/data/com.termux/files/usr/bin/pactl /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/pulseaudio/libpulsecore-17.0.so /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/pulseaudio/libpulsecommon-17.0.so /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/libpulse.so /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/libltdl.so /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/libsndfile.so /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/libdbus-1.so /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/libsoxr.so /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/libspeexdsp.so /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/libiconv.so /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/libandroid-execinfo.so /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/libandroid-glob.so /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/libFLAC.so /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/libvorbis.so /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/libvorbisenc.so /tmp/artifacts/ 
            cp /data/data/com.termux/files/usr/lib/libopus.so /tmp/artifacts/ 
            cp /data/data/com.termux/files/usr/lib/libogg.so /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/libmp3lame.so /tmp/artifacts/

            cp /data/data/com.termux/files/usr/etc/pulse/daemon.conf /tmp/artifacts/
            cp /data/data/com.termux/files/usr/etc/pulse/default.pa /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/pulseaudio/modules/* /tmp/artifacts/
      - run:
          name: Build dropbear for << parameters.arch >>
          command: |
            cd ~/termux-packages
            ./build-package.sh -I -f -a << parameters.arch >> dropbear
          no_output_timeout: 30m
      - run:
          name: Save dropbear files for << parameters.arch >>
          command: |
            mkdir -p /tmp/artifacts
            ls /data/data/com.termux/files/usr/bin/
            ls /data/data/com.termux/files/usr/lib/

            cp /data/data/com.termux/files/usr/bin/dbclient /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/libutil.so /tmp/artifacts/ 
            cp /data/data/com.termux/files/usr/lib/libtermux-auth.so /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/libcrypto.so.3 /tmp/artifacts/
      - run:
          name: Build proot for << parameters.arch >>
          command: |
            git clone https://github.com/CypherpunkArmory/proot.git ~/proot
            cd ~/proot 
            git fetch
            git checkout droid_files
            cd ~/termux-packages
            ./build-package.sh -I -f -a << parameters.arch >> libtalloc
            PROOT_DIR=~/proot ./build-package.sh -I -f -a << parameters.arch >> proot
          no_output_timeout: 30m
      - run:
          name: Save proot files for << parameters.arch >>
          command: |
            mkdir -p /tmp/artifacts
            ls /data/data/com.termux/files/usr/bin/
            ls /data/data/com.termux/files/usr/lib/

            cp /data/data/com.termux/files/usr/bin/proot /tmp/artifacts/
            cp /data/data/com.termux/files/usr/libexec/proot/loader /tmp/artifacts/
            cp /data/data/com.termux/files/usr/libexec/proot/loader32 /tmp/artifacts/ || true
            cp /data/data/com.termux/files/usr/lib/libtalloc.so.2 /tmp/artifacts/
      - run:
          name: Build proot.a10 for << parameters.arch >>
          command: |
            cd ~/termux-packages
            sed -i 's/-DARG_MAX/-DPROTECTED_ASHMEM=1 -DARG_MAX/g' packages/proot/build.sh
            sed -i 's/"24"/"26"/g' scripts/build/termux_step_setup_variables.sh
            rm -rf /data/data/.built-packages/*
            ./build-package.sh -I -f -a << parameters.arch >> libtalloc
            PROOT_DIR=~/proot ./build-package.sh -I -f -a << parameters.arch >> proot
          no_output_timeout: 30m
      - run:
          name: Save proot.a10 files for << parameters.arch >>
          command: |
            mkdir -p /tmp/artifacts
            ls /data/data/com.termux/files/usr/bin/
            ls /data/data/com.termux/files/usr/lib/

            cp /data/data/com.termux/files/usr/bin/proot /tmp/artifacts/proot.a10
            cp /data/data/com.termux/files/usr/libexec/proot/loader /tmp/artifacts/loader.a10
            cp /data/data/com.termux/files/usr/libexec/proot/loader32 /tmp/artifacts/loader32.a10 || true
            cp /data/data/com.termux/files/usr/lib/libtalloc.so.2 /tmp/artifacts/libtalloc.so.2.a10
      - run:
          name: Collect artifacts and create zip for << parameters.arch >>
          command: |
            mkdir -p /tmp/workspace
            zip -j /tmp/workspace/<< parameters.zip_arch >>-assets.zip /tmp/artifacts/*
      - store_artifacts:
          path: /tmp/workspace/<< parameters.zip_arch >>-assets.zip
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - << parameters.zip_arch >>-assets.zip

jobs:
  build-arm:
    executor: package-builder
    steps:
      - build_packages:
          arch: arm
          zip_arch: armeabi-v7a
          asset_arch: arm

  build-arm64:
    executor: package-builder
    steps:
      - build_packages:
          arch: aarch64
          zip_arch: arm64-v8a
          asset_arch: arm64

  build-x86:
    executor: package-builder
    steps:
      - build_packages:
          arch: i686
          zip_arch: x86
          asset_arch: x86

  build-x64:
    executor: package-builder
    steps:
      - build_packages:
          arch: x86_64
          zip_arch: x86_64
          asset_arch: x86_64

  release:
    docker:
      - image: cimg/base:stable
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Install GitHub CLI
          command: |
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] \
              https://cli.github.com/packages stable main" \
              | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update -q
            sudo apt-get install -y gh
      - run:
          name: Create GitHub release
          command: |
            TAG="${CIRCLE_TAG}"
            gh release create "$TAG" /tmp/workspace/*.zip \
              --repo "CypherpunkArmory/UserLAnd-Assets-Support" \
              --title "Build ${CIRCLE_BUILD_NUM}" \
              --notes "Automated build from CircleCI pipeline ${CIRCLE_PIPELINE_NUMBER} (${CIRCLE_BRANCH})"

workflows:
  build-proot-all-archs:
    jobs:
      - build-arm:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - build-arm64:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - build-x86:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - build-x64:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - release:
          requires:
            - build-arm
            - build-arm64
            - build-x86
            - build-x64
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/

