version: 2.1

executors:
  package-builder:
    docker:
      - image: termux/package-builder:latest
    resource_class: medium

commands:
  build_packages:
    parameters:
      arch:
        type: string
    steps:
      - run:
          name: Build proot for << parameters.arch >>
          command: |
            cd /
            ./build-package.sh -a << parameters.arch >> proot
          no_output_timeout: 30m
      - run:
          name: Build pulseaudio for << parameters.arch >>
          command: |
            cd ~/termux-packages
            ./build-package.sh -a << parameters.arch >> pulseaudio
          no_output_timeout: 30m
      - run:
          name: Collect .deb artifacts and create tar for << parameters.arch >>
          command: |
            mkdir -p /tmp/artifacts /tmp/workspace
            find ~/termux-packages/output -name '*.deb' -exec cp {} /tmp/artifacts/ \;
            tar -czf /tmp/workspace/debs-<< parameters.arch >>.tar.gz -C /tmp/artifacts .
      - store_artifacts:
          path: /tmp/workspace/debs-<< parameters.arch >>.tar.gz
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - debs-<< parameters.arch >>.tar.gz

jobs:
  build-arm:
    executor: package-builder
    steps:
      - build_packages:
          arch: arm

  build-arm64:
    executor: package-builder
    steps:
      - build_packages:
          arch: aarch64

  build-x86:
    executor: package-builder
    steps:
      - build_packages:
          arch: i686

  build-x64:
    executor: package-builder
    steps:
      - build_packages:
          arch: x86_64

  release:
    docker:
      - image: cimg/base:stable
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Install GitHub CLI
          command: |
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] \
              https://cli.github.com/packages stable main" \
              | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update -q
            sudo apt-get install -y gh
      - run:
          name: Create GitHub release
          command: |
            TAG="${CIRCLE_TAG}"
            gh release create "$TAG" /tmp/workspace/*.tar.gz \
              --repo "CypherpunkArmory/UserLAnd-Assets-Support" \
              --title "Build ${CIRCLE_BUILD_NUM}" \
              --notes "Automated build from CircleCI pipeline ${CIRCLE_PIPELINE_NUMBER} (${CIRCLE_BRANCH})"

workflows:
  build-proot-all-archs:
    jobs:
      - build-arm
      - build-arm64
      - build-x86
      - build-x64
      - release:
          requires:
            - build-arm
            - build-arm64
            - build-x86
            - build-x64
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/

