version: 2.1

executors:
  package-builder:
    docker:
      - image: ghcr.io/termux/package-builder:latest
    resource_class: medium

commands:
  build_packages:
    parameters:
      arch:
        type: string
    steps:
      - run:
          name: Clone termux-packages
          command: |
            git clone --depth 1 https://github.com/termux/termux-packages.git ~/termux-packages
      - run:
          name: Build pulseaudio for << parameters.arch >>
          command: |
            cd ~/termux-packages
            ./build-package.sh -I -f -a << parameters.arch >> pulseaudio
          no_output_timeout: 30m
      - run:
          name: Save pulseaudio files for << parameters.arch >>
          command: |
            mkdir -p /tmp/artifacts
            ls /data/data/com.termux/files/usr/bin/
            ls /data/data/com.termux/files/usr/lib/
            ls /data/data/com.termux/files/usr/etc/pulse/
            ls /data/data/com.termux/files/usr/lib/pulseaudio/
            ls /data/data/com.termux/files/usr/lib/pulseaudio/modules/

            cp /data/data/com.termux/files/usr/bin/pulseaudio /tmp/artifacts/
            cp /data/data/com.termux/files/usr/bin/pactl /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/pulseaudio/libpulsecore-17.0.so /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/pulseaudio/libpulsecommon-17.0.so /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/libpulse.so /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/libltdl.so /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/libsndfile.so /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/libdbus-1.so /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/libsoxr.so /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/libspeexdsp.so /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/libiconv.so /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/libandroid-execinfo.so /tmp/artifacts/

            #cp /data/data/com.termux/files/usr/lib/libandroid-glob.so $ARCH_DIR/libandroid-glob.so
            #cp /data/data/com.termux/files/usr/lib/libogg.so $ARCH_DIR/libogg.so
            #cp /data/data/com.termux/files/usr/lib/libvorbis.so $ARCH_DIR/libvorbis.so
            #cp /data/data/com.termux/files/usr/lib/libvorbisenc.so $ARCH_DIR/libvorbisenc.so
            #cp /data/data/com.termux/files/usr/lib/libFLAC.so $ARCH_DIR/libFLAC.so

            cp /data/data/com.termux/files/usr/etc/pulse/daemon.conf /tmp/artifacts/
            cp /data/data/com.termux/files/usr/etc/pulse/default.pa /tmp/artifacts/
            cp /data/data/com.termux/files/usr/lib/pulseaudio/modules/* /tmp/artifacts/
      - run:
          name: Build proot for << parameters.arch >>
          command: |
            git clone https://github.com/CypherpunkArmory/proot.git ~/proot
            cd ~/proot 
            git fetch
            git checkout droid_files
            cd ~/termux-packages
            ./build-package.sh -I -f -a << parameters.arch >> libtalloc
            PROOT_DIR=~/proot ./build-package.sh -I -f -a << parameters.arch >> proot
          no_output_timeout: 30m
      - run:
          name: Save proot files for << parameters.arch >>
          command: |
            mkdir -p /tmp/artifacts
            ls /data/data/com.termux/files/usr/bin/
            ls /data/data/com.termux/files/usr/lib/

            cp /data/data/com.termux/files/usr/bin/proot /tmp/artifacts/
            cp /data/data/com.termux/files/usr/libexec/proot/loader /tmp/artifacts/
            cp /data/data/com.termux/files/usr/libexec/proot/loader32 /tmp/artifacts/ || true
            cp /data/data/com.termux/files/usr/lib/libtalloc.so.2 /tmp/artifacts/
      - run:
          name: Collect artifacts and create zip for << parameters.arch >>
          command: |
            mkdir -p /tmp/workspace
            zip -j /tmp/workspace/<< parameters.arch >>-assets.zip /tmp/artifacts/*
      - store_artifacts:
          path: /tmp/workspace/<< parameters.arch >>-assets.zip
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - << parameters.arch >>-assets.zip

jobs:
  build-arm:
    executor: package-builder
    steps:
      - build_packages:
          arch: arm

  build-arm64:
    executor: package-builder
    steps:
      - build_packages:
          arch: aarch64

  build-x86:
    executor: package-builder
    steps:
      - build_packages:
          arch: i686

  build-x64:
    executor: package-builder
    steps:
      - build_packages:
          arch: x86_64

  release:
    docker:
      - image: cimg/base:stable
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Install GitHub CLI
          command: |
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] \
              https://cli.github.com/packages stable main" \
              | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update -q
            sudo apt-get install -y gh
      - run:
          name: Create GitHub release
          command: |
            TAG="${CIRCLE_TAG}"
            gh release create "$TAG" /tmp/workspace/*.zip \
              --repo "CypherpunkArmory/UserLAnd-Assets-Support" \
              --title "Build ${CIRCLE_BUILD_NUM}" \
              --notes "Automated build from CircleCI pipeline ${CIRCLE_PIPELINE_NUMBER} (${CIRCLE_BRANCH})"

workflows:
  build-proot-all-archs:
    jobs:
      - build-arm:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - build-arm64:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - build-x86:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - build-x64:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - release:
          requires:
            - build-arm
            - build-arm64
            - build-x86
            - build-x64
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/

